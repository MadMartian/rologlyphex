name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        run: |
          CARGO_VERSION="$(cargo pkgid | cut -d'#' -f2)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libx11-dev libxtst-dev libxext-dev pkg-config
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          STAGE="rologlyphex-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$STAGE"
          cp target/release/rologlyphex rologlyphex.service LICENSE NOTICE README.md "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Build .rpm package
        run: |
          # RPM version fields reject '-'; a semver pre-release (e.g. v0.2.0-rc.1)
          # crashes cargo-generate-rpm otherwise. '~' is RPM's own pre-release marker.
          RPM_VERSION="$(cargo pkgid | cut -d'#' -f2 | tr '-' '~')"
          cargo generate-rpm -s "version=\"$RPM_VERSION\""

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rologlyphex-*.tar.gz
            target/debian/*.deb
            target/generate-rpm/*.rpm
