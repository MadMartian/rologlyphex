<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Rologlyphex: a rotary deck-selector (Rolodex + glyphs), on the dark overlay.
       White knob; blue pointer/hub (active indicator); amber selected-deck dot. -->
  <!-- knob -->
  <circle cx="12" cy="12" r="6.6" fill="none" stroke="#ffffff" stroke-width="1.7"/>
  <!-- pointer + hub (blue, the active indicator) -->
  <line x1="12" y1="12" x2="12" y2="6.9" stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="12" cy="12" r="1.5" fill="#60a5fa"/>
  <!-- deck positions; the selected one (top, where the pointer aims) is amber -->
  <circle cx="12" cy="2.7" r="1.3" fill="#fbbf24"/>
  <circle cx="21.3" cy="12" r="1" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="12" cy="21.3" r="1" fill="#ffffff" fill-opacity="0.45"/>
  <circle cx="2.7" cy="12" r="1" fill="#ffffff" fill-opacity="0.45"/>
</svg>
